title: Rails Girls São Paulo
description: Guia do workshop Rails Girls São Paulo
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
search_enabled: true
lang: pt-BR
color_scheme: railsgirls

# Rubi, a tutora com IA (assets/js/mentora.js), ligada ao backend Mentora.
# enabled: false não carrega nada. Com enabled: true, o botão aparece para
# todo mundo, mas perguntar exige o código do workshop.
mentora:
  enabled: true
  api_url: https://mentora-railsgirls-api.elaine-n-watanabe.workers.dev

# Diagramas em blocos ```mermaid, desenhados no navegador.
mermaid:
  version: "12.1.0"

# Boxes de destaque. Uso: uma linha com {: .dica } antes do parágrafo.
# pensando: a forma de pensar de quem programa, além da técnica.
# desafio: o desafio do capítulo numa frase, no fim de O desafio.
callouts:
  dica:
    title: Dica
    color: green
  atencao:
    title: Atenção
    color: red
  ia:
    title: E se fosse com IA?
    color: purple
  pensando:
    title: Pensando como quem programa
    color: blue
  desafio:
    title: Tarefa
    color: red

footer_content: >-
  Material de Rails Girls São Paulo, licenciado sob
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br">CC BY-NC-SA 4.0</a>.
  Uso livre e gratuito com atribuição; uso comercial proibido.

exclude:
  - README.md
  - LICENSE.md
  - CODE_OF_CONDUCT.md
  - Gemfile
  - Gemfile.lock
  - vendor
  # Guia em inglês, gerado à parte pelo bin/build-en.
  - en
  - bin

# Silencia avisos do Sass vindos do tema ao rodar localmente.
sass:
  quiet_deps: true
  silence_deprecations: [import]

# O GitHub Pages aplica este layout sozinho; localmente precisa ser explícito.
defaults:
  - scope:
      path: ""
    values:
      layout: default
