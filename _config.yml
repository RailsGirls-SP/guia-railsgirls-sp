title: Rails Girls São Paulo
description: Guia do workshop Rails Girls São Paulo
remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
search_enabled: true
lang: pt-BR
color_scheme: railsgirls

# Diagramas em blocos ```mermaid, desenhados no navegador.
mermaid:
  version: "12.1.0"

# Boxes de destaque. Uso: uma linha com {: .dica } antes do parágrafo.
# pensando: a forma de pensar de quem programa, além da técnica.
callouts:
  dica:
    title: Dica
    color: green
  atencao:
    title: Atenção
    color: red
  ia:
    title: E se fosse com IA?
    color: purple
  pensando:
    title: Pensando como quem programa
    color: blue

footer_content: >-
  Material de Rails Girls São Paulo, licenciado sob
  <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.pt-br">CC BY-NC-SA 4.0</a>.
  Uso livre e gratuito com atribuição; uso comercial proibido.

exclude:
  - README.md
  - LICENSE.md
  - CODE_OF_CONDUCT.md
  - Gemfile
  - Gemfile.lock
  - vendor

# Silencia avisos do Sass vindos do tema ao rodar localmente.
sass:
  quiet_deps: true
  silence_deprecations: [import]

# O GitHub Pages aplica este layout sozinho; localmente precisa ser explícito.
defaults:
  - scope:
      path: ""
    values:
      layout: default
